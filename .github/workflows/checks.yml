name: 校验与测试

# 改了数据或脚本就跑：校验 data/，跑四组测试，再用仓库里的 data/ 生成一遍看板。
# 在 main 上，生成的看板存成这次运行的附件（Artifacts），有仓库权限的人可以下载；前面任何一步没过就不存。
# 只读仓库。除了装依赖，不联网取别的东西。
on:
  push:
    paths:
      - "data/**"
      - "tools/**"
      - ".github/workflows/checks.yml"
  pull_request:
    paths:
      - "data/**"
      - "tools/**"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: 校验 data/ 并跑测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # V-72 要和推送之前的那次提交比
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 装依赖
        run: pip install -r tools/requirements.txt
      - name: 校验 data/
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # 两个日志只能在末尾加（V-72）：推送时和推送之前的那次提交比，合并请求和目标分支比
          base="$BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="origin/$BASE_REF"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="HEAD"; fi
          python3 tools/validate.py --base "$base"
      - name: 校验脚本的测试
        run: python3 tools/tests/test_validate.py
      - name: 登记与机器核对脚本的测试
        run: python3 tools/tests/test_step1.py
      - name: 装测试看板要用的包
        run: pip install -r tools/requirements-test.txt
      - name: 看板生成脚本的测试
        env:
          DASHBOARD_BROWSER_TESTS: required   # 页面脚本要用浏览器测，这里不许跳过
        run: python3 tools/tests/test_dashboard.py
      - name: 派生值和对标视图的测试
        env:
          DASHBOARD_BROWSER_TESTS: required
        run: python3 tools/tests/test_step3.py
      - name: 用仓库里的 data/ 生成看板
        run: |
          python3 tools/build_dashboard.py --out site --strict
          # 同一次提交在哪台机器上生成都应当逐字节相同：把校验和记在日志里，下载下来的或本机生成的可以拿来对
          sha256sum site/index.html site/evidence-internal.csv
          # 仓库里的 data/ 还没有证据时上面是空表。再用测试的示例数据（13 条虚构的证据）生成一份，只为了记下校验和来对；不存成附件
          python3 tools/build_dashboard.py --data tools/tests/example --out "$RUNNER_TEMP/site-example" > /dev/null
          (cd "$RUNNER_TEMP/site-example" && sha256sum index.html evidence-internal.csv)
      - name: 给这次生成的看板起名（只在 main 上）
        id: dashboard
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "name=dashboard-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: 把看板存成这次运行的附件
        if: steps.dashboard.outputs.name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dashboard.outputs.name }}   # dashboard-提交号，和页面上写的数据版本是同一个号
          path: site/
          retention-days: 14        # 随时可以从同一次提交重新生成，不必久留
          if-no-files-found: error
